project_name: "AI-Web3-Lab"
environment: "${APP_ENV:-development}"

paths:
  raw_data: "02-AI-Automation/data/raw"
  processed_data: "02-AI-Automation/data/processed"
  logs: "02-AI-Automation/logs"

collectors:
  web3_news:
    enabled: true
  ai_news:
    enabled: true
  crypto_market:
    enabled: true

api:
  web3_news:
    base_url: "${WEB3_NEWS_API_BASE_URL:-}"
    api_key: "${WEB3_NEWS_API_KEY:-}"
  ai_news:
    base_url: "${AI_NEWS_API_BASE_URL:-}"
    api_key: "${AI_NEWS_API_KEY:-}"
  crypto_market:
    base_url: "${CRYPTO_MARKET_API_BASE_URL:-}"
    api_key: "${CRYPTO_MARKET_API_KEY:-}"

scheduler:
  enabled: true
  timezone: "${SCHEDULER_TIMEZONE:-Asia/Shanghai}"
  interval_minutes: 60
